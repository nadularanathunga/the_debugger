<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Market - Sign Up</title>
    
    <!-- External Google Font to replace extension fallback fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen font-sans py-10 px-4">
    
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-lg">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-extrabold text-gray-800">Create Account</h2>
            <p class="text-gray-500 mt-2">Join Skill Market and start exploring.</p>
        </div>

        <form id="signupForm" class="space-y-4">
            <!-- Full Name -->
            <div>
                <label for="full_name" class="block text-sm font-semibold text-gray-700 mb-1">Full Name</label>
                <input 
                    type="text" 
                    id="full_name" 
                    name="full_name"
                    autocomplete="name"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" 
                    required
                >
            </div>

            <!-- Email -->
            <div>
                <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email"
                    autocomplete="email"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" 
                    required
                >
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password"
                    autocomplete="new-password"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" 
                    required
                >
            </div>

            <!-- Role -->
            <div>
                <label for="role" class="block text-sm font-semibold text-gray-700 mb-1">Register As</label>
                <select 
                    id="role" 
                    name="role"
                    class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white" 
                    required 
                    onchange="toggleStudentFields()"
                >
                    <option value="student">Student</option>
                    <option value="client">Client (Local/Outsider)</option>
                    <option value="lecturer">Lecturer</option>
                </select>
            </div>

            <!-- Student Only Fields -->
            <div id="student_fields" class="grid grid-cols-2 gap-4">
                <div>
                    <label for="department" class="block text-sm font-semibold text-gray-700 mb-1">Department</label>
                    <select 
                        id="department" 
                        name="department"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none bg-white"
                    >
                        <option value="NONE">None</option>
                        <option value="ICT">ICT</option>
                        <option value="ET">ET</option>
                        <option value="BST">BST</option>
                    </select>
                </div>
                <div>
                    <label for="student_id_number" class="block text-sm font-semibold text-gray-700 mb-1">Student ID</label>
                    <input 
                        type="text" 
                        id="student_id_number" 
                        name="student_id_number"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" 
                        placeholder="e.g. TG/2022/101"
                    >
                </div>
            </div>

            <button 
                type="submit" 
                id="submitBtn"
                class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition duration-300 shadow-md mt-4"
            >
                Sign Up
            </button>
        </form>

        <div id="message" class="mt-4 text-center text-sm font-semibold hidden"></div>
        
        <div class="mt-6 text-center text-sm text-gray-600">
            Already have an account? <a href="login.html" class="text-blue-600 hover:underline font-semibold">Login</a>
        </div>
    </div>

    <script>
        function toggleStudentFields() {
            const role = document.getElementById('role').value;
            const studentFields = document.getElementById('student_fields');
            if (role === 'student') {
                studentFields.classList.remove('hidden');
            } else {
                studentFields.classList.add('hidden');
                document.getElementById('department').value = 'NONE';
                document.getElementById('student_id_number').value = '';
            }
        }

        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const role = document.getElementById('role').value;
            const submitBtn = document.getElementById('submitBtn');
            const messageEl = document.getElementById('message');

            const payload = {
                action: 'signup',
                full_name: document.getElementById('full_name').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value,
                role: role,
                department: role === 'student' ? document.getElementById('department').value : null,
                student_id_number: role === 'student' ? document.getElementById('student_id_number').value.trim() : null
            };

            messageEl.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerText = 'Creating Account...';

            try {
                const response = await fetch('../../../backend/api/auth_api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                
                messageEl.classList.remove('hidden');
                if (data.status === 'success') {
                    messageEl.className = 'mt-4 text-center text-sm font-semibold text-green-600';
                    messageEl.innerText = 'Account created successfully! Redirecting...';
                    setTimeout(() => window.location.href = 'login.html', 1500);
                } else {
                    messageEl.className = 'mt-4 text-center text-sm font-semibold text-red-600';
                    messageEl.innerText = data.message || 'Signup failed. Please try again.';
                }
            } catch (error) {
                console.error('Error:', error);
                messageEl.classList.remove('hidden');
                messageEl.className = 'mt-4 text-center text-sm font-semibold text-red-600';
                messageEl.innerText = 'Server connection error. Please check your network or server setup.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = 'Sign Up';
            }
        });
    </script>
</body>
</html>
