<body class="bg-surface h-full flex flex-col items-center justify-center font-body-md text-on-surface antialiased selection:bg-secondary-container selection:text-on-secondary-container">
<!-- Suppressed Top Nav as this is a transactional page -->
<main class="w-full max-w-md px-margin-mobile sm:px-margin-desktop py-stack-xl flex-grow flex flex-col justify-center">
<!-- Brand / Header -->
<div class="text-center mb-stack-lg">
<h1 class="font-display-lg text-display-lg hidden sm:block text-primary mb-stack-sm">Skill Bridge</h1>
<h1 class="font-display-lg-mobile text-display-lg-mobile sm:hidden text-primary mb-stack-sm">Skill Bridge</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Welcome back. Please enter your details.</p>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest rounded-[16px] border border-surface-container-high shadow-[0px_4px_20px_rgba(15,23,42,0.05)] p-stack-lg sm:p-[32px] transition-shadow duration-300 hover:shadow-[0px_8px_30px_rgba(15,23,42,0.08)]">
<form id="login-form" class="space-y-stack-md">
<!-- Email Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-stack-xs uppercase tracking-wider" for="email">Email</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-[20px]">mail</span>
</div>
<input class="block w-full pl-10 h-[48px] rounded-lg border-0 py-1.5 text-on-surface bg-[#F1F5F9] shadow-sm ring-1 ring-inset ring-surface-container-high focus:ring-2 focus:ring-inset focus:ring-secondary-container sm:text-sm sm:leading-6 transition-all duration-200" id="email" name="email" placeholder="student@stu.ac.lk" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<label class="block font-label-md text-label-md text-on-surface mb-stack-xs uppercase tracking-wider" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline-variant text-[20px]">lock</span>
</div>
<input class="block w-full pl-10 h-[48px] rounded-lg border-0 py-1.5 text-on-surface bg-[#F1F5F9] shadow-sm ring-1 ring-inset ring-surface-container-high focus:ring-2 focus:ring-inset focus:ring-secondary-container sm:text-sm sm:leading-6 transition-all duration-200" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
</div>
<!-- Utilities -->
<div class="flex items-center justify-between mt-stack-sm">
<div class="flex items-center">
<input class="h-4 w-4 rounded border-surface-container-high text-secondary-container focus:ring-secondary-container bg-[#F1F5F9]" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block font-body-sm text-body-sm text-on-surface-variant" for="remember-me">Remember me</label>
</div>
<div class="text-sm">
<a class="font-body-sm text-body-sm font-medium text-secondary-container hover:text-on-secondary-fixed-variant transition-colors duration-200" href="#">Forgot password?</a>
</div>
</div>
<!-- Submit Button -->
<div class="pt-stack-xs">
<button class="flex w-full justify-center items-center h-[48px] rounded-xl bg-primary-container px-3 py-1.5 font-label-md text-label-md text-on-primary shadow-sm hover:bg-on-secondary-fixed focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-primary-container transition-colors duration-200" type="submit">
                        Login
                    </button>
</div>
</form>
<div class="mt-stack-lg">
<div class="relative">
<div aria-hidden="true" class="absolute inset-0 flex items-center">
<div class="w-full border-t border-surface-container-high"></div>
</div>
<div class="relative flex justify-center">
<span class="bg-surface-container-lowest px-2 font-body-sm text-body-sm text-outline">Or continue with</span>
</div>
</div>
<!-- University SSO Button -->
<div class="mt-stack-md">
<a class="flex w-full items-center justify-center gap-3 h-[48px] rounded-xl bg-surface px-3 py-1.5 text-on-surface shadow-sm ring-1 ring-inset ring-surface-container-high hover:bg-surface-container-low transition-colors duration-200 font-label-md text-label-md" href="#">
<span class="material-symbols-outlined text-[20px] text-secondary">school</span>
<span class="font-medium">Login with University ID</span>
</a>
</div>
</div>
<!-- Sign Up Link -->
<p class="mt-stack-lg text-center font-body-sm text-body-sm text-on-surface-variant">
                Don't have an account?
                <a class="font-medium text-secondary-container hover:text-on-secondary-fixed-variant transition-colors duration-200" href="signup.html">Sign Up</a>
</p>
</div>
</main>
<!-- Suppressed Footer as this is a transactional page -->
<script>
    document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            const res = await fetch('../../../backend/api/auth_api.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ action: 'login', email, password })
            });
            const data = await res.json();
            if (data.status === 'success') {
                localStorage.setItem('user_id', data.user_id);
                localStorage.setItem('full_name', data.full_name);
                localStorage.setItem('role', data.role);
                alert('Login successful!');
                // Redirect based on role
                if (data.role === 'student') window.location.href = '../student/student_dashboard.html';
                else if (data.role === 'client') window.location.href = '../client/dashboard.html';
                else if (data.role === 'admin') window.location.href = '../admin/dashboard.html';
            } else {
                alert('Error: ' + data.message);
            }
        } catch (error) {
            console.error('Error:', error);
            alert('An error occurred during login.');
        }
    });
</script>
