<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skill Market - Login</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen font-sans">
    
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-8">
            <h2 class="text-3xl font-extrabold text-gray-800">Skill Market</h2>
            <p class="text-gray-500 mt-2">Welcome back! Please login to your account.</p>
        </div>

        <form id="loginForm" class="space-y-5">
            <!-- Email Input -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Email Address</label>
                <input type="email" id="email" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="Enter your email" required>
            </div>

            <!-- Password Input -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Password</label>
                <input type="password" id="password" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition" placeholder="Enter your password" required>
            </div>

            <!-- Role Selection -->
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Login As</label>
                <select id="role" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition bg-white" required>
                    <option value="student">Student</option>
                    <option value="client">Client</option>
                    <option value="lecturer">Lecturer</option>
                    <option value="admin">Admin</option>
                </select>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition duration-300 shadow-md">
                Login
            </button>
        </form>

        <!-- Response Message -->
        <div id="message" class="mt-4 text-center text-sm font-semibold hidden"></div>
        
        <div class="mt-6 text-center text-sm text-gray-600">
            Don't have an account? <a href="signup.html" class="text-blue-600 hover:underline font-semibold">Sign up</a>
        </div>
    </div>

    <!-- Frontend Logic (JavaScript) -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault(); // Prevent page reload
            
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role = document.getElementById('role').value;
            const messageEl = document.getElementById('message');

            messageEl.classList.add('hidden'); // Reset message

            try {
                // API Call to Backend
                const response = await fetch('../../../backend/api/auth_api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'login', email, password, role })
                });
                
                const data = await response.json();
                
                messageEl.classList.remove('hidden');
                if (data.status === 'success') {
                    messageEl.className = 'mt-4 text-center text-sm font-semibold text-green-600';
                    messageEl.innerText = 'Login Successful! Redirecting...';
                    
                    // Store user data in localStorage (Optional but useful)
                    localStorage.setItem('user_id', data.user_id);
                    
                    // Redirect to corresponding dashboard
                    setTimeout(() => {
                        window.location.href = `../${role}/${role}_dashboard.html`;
                    }, 1500);
                } else {
                    messageEl.className = 'mt-4 text-center text-sm font-semibold text-red-600';
                    messageEl.innerText = data.message;
                }
            } catch (error) {
                console.error('Error:', error);
                messageEl.classList.remove('hidden');
                messageEl.className = 'mt-4 text-center text-sm font-semibold text-red-600';
                messageEl.innerText = 'Server error occurred.';
            }
        });
    </script>
</body>
</html>
