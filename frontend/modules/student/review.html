<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Star Rating Logic
            const stars = document.querySelectorAll('.star-rating .material-symbols-outlined');
            const ratingLabel = document.getElementById('rating-label');
            const ratingInput = document.getElementById('rating-value');
            const submitBtn = document.getElementById('submit-btn');
            
            const labels = {
                1: 'Poor',
                2: 'Fair',
                3: 'Good',
                4: 'Very Good',
                5: 'Excellent'
            };

            let currentRating = 0;

            function updateStars(value, isHover = false) {
                stars.forEach(star => {
                    const starVal = parseInt(star.dataset.value);
                    if (starVal <= value) {
                        star.classList.add(isHover ? 'hover-active' : 'filled');
                        if(!isHover) star.classList.remove('hover-active');
                    } else {
                        if(isHover) {
                            star.classList.remove('hover-active');
                        } else {
                            star.classList.remove('filled');
                        }
                    }
                });

                if (value > 0) {
                    ratingLabel.textContent = `${value} - ${labels[value]}`;
                    ratingLabel.style.opacity = '1';
                } else if (!isHover && currentRating === 0) {
                    ratingLabel.style.opacity = '0';
                }
            }

            stars.forEach(star => {
                star.addEventListener('mouseover', function() {
                    updateStars(parseInt(this.dataset.value), true);
                });

                star.addEventListener('mouseout', function() {
                    stars.forEach(s => s.classList.remove('hover-active'));
                    updateStars(currentRating);
                });

                star.addEventListener('click', function() {
                    currentRating = parseInt(this.dataset.value);
                    ratingInput.value = currentRating;
                    updateStars(currentRating);
                    
                    // Enable submit button
                    submitBtn.removeAttribute('disabled');
                    
                    // Update ARIA states
                    stars.forEach(s => s.setAttribute('aria-checked', 'false'));
                    this.setAttribute('aria-checked', 'true');
                });
                
                // Keyboard support for stars
                star.addEventListener('keydown', function(e) {
                    if (e.key === 'Enter' || e.key === ' ') {
                        e.preventDefault();
                        this.click();
                    }
                });
            });

            // Feedback Chips Logic
            const chips = document.querySelectorAll('.feedback-chip');
            chips.forEach(chip => {
                chip.addEventListener('click', function() {
                    this.classList.toggle('selected');
                    // Toggle aria-pressed if we want it strictly semantic, but class toggle is fine for visual
                });
            });
        });

        // Modal Logic
        function showSuccessState() {
            const modal = document.getElementById('success-modal');
            modal.classList.add('active');
            modal.setAttribute('aria-hidden', 'false');
            // Focus trap or basic focus management could go here
        }

        function closeSuccessState() {
            const modal = document.getElementById('success-modal');
            modal.classList.remove('active');
            modal.setAttribute('aria-hidden', 'true');
            // Reset form for demo purposes
            document.getElementById('review-form').reset();
            document.getElementById('rating-value').value = '';
            document.querySelectorAll('.star-rating .material-symbols-outlined').forEach(s => {
                s.classList.remove('filled');
                s.setAttribute('aria-checked', 'false');
            });
            document.getElementById('rating-label').style.opacity = '0';
            document.querySelectorAll('.feedback-chip').forEach(c => c.classList.remove('selected'));
            document.getElementById('submit-btn').setAttribute('disabled', 'true');
        }
        async function submitReview() {
            const urlParams = new URLSearchParams(window.location.search);
            const taskId = urlParams.get('task_id') || 1; // Default for demo
            const studentId = urlParams.get('student_id') || 2; // Default for demo
            const clientId = localStorage.getItem('user_id');
            const rating = document.getElementById('rating-value').value;
            const comment = document.getElementById('review-text').value;
            
            try {
                const response = await fetch('../../../backend/api/reviews_api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        action: 'create',
                        task_id: taskId,
                        client_id: clientId,
                        student_id: studentId,
                        rating: rating,
                        comment: comment
                    })
                });
                const data = await response.json();
                
                if (data.status === 'success') {
                    showSuccessState();
                } else {
                    alert('Error: ' + data.message);
                }
            } catch (error) {
                console.error("Error submitting review:", error);
                alert("Server error occurred.");
            }
        }
    </script>
