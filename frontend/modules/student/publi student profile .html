<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Profile - Skill Market</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <nav class="bg-blue-600 text-white p-4 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">Student Profile</h1>
            <button onclick="window.history.back()" class="hover:text-blue-200">Go Back</button>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto mt-10 p-4">
        <!-- Profile Header -->
        <div class="bg-white p-8 rounded-xl shadow-md border-t-4 border-blue-500 mb-6 flex items-center space-x-6">
            <div class="w-24 h-24 bg-gray-200 rounded-full flex items-center justify-center text-4xl">
                🎓
            </div>
            <div>
                <h2 class="text-3xl font-extrabold text-gray-800" id="student_name">Loading...</h2>
                <p class="text-gray-500 mt-1" id="student_dept">Department: Loading...</p>
                <div class="mt-2">
                    <span class="bg-green-100 text-green-800 text-xs font-bold px-2 py-1 rounded">Verified Student</span>
                </div>
            </div>
        </div>

        <!-- Offered Skills -->
        <h3 class="text-xl font-bold text-gray-800 mb-4">Skills Offered</h3>
        <div id="student_skills_list" class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <!-- Skills will load here -->
        </div>
    </div>

    <script>
        // In a real application, you would pass the student ID via URL (e.g., ?id=2)
        const profileStudentId = 2; 

        async function loadStudentProfile() {
            try {
                // We use the student API to fetch profile details
                const response = await fetch('../../../backend/api/student/student_api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'get_public_profile', student_id: profileStudentId })
                });
                const data = await response.json();
                
                if (data.status === 'success') {
                    document.getElementById('student_name').innerText = data.user.full_name;
                    document.getElementById('student_dept').innerText = `Department: ${data.user.department}`;
                    
                    const list = document.getElementById('student_skills_list');
                    if(data.skills.length > 0) {
                        list.innerHTML = data.skills.map(s => `
                            <div class="bg-white p-5 rounded-lg shadow-sm border border-gray-200">
                                <span class="text-xs font-bold text-purple-600 uppercase">${s.category}</span>
                                <h4 class="text-lg font-bold text-gray-800">${s.skill_name}</h4>
                                <p class="text-sm text-gray-600 mt-2">${s.description}</p>
                                <p class="text-green-600 font-bold mt-3">Indicative Rate: Rs. ${s.price}</p>
                            </div>
                        `).join('');
                    } else {
                        list.innerHTML = `<p class="text-gray-500">This student hasn't listed any skills yet.</p>`;
                    }
                }
            } catch (error) {
                console.error("Error:", error);
            }
        }

        loadStudentProfile();
    </script>
</body>
</html>
