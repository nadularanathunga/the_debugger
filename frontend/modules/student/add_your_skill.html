<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Your Skill - Skill Market</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans p-6">

    <div class="max-w-2xl mx-auto bg-white p-8 rounded-xl shadow-md">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-extrabold text-gray-800">Add a New Skill</h2>
            <a href="myskill.html" class="text-blue-600 font-semibold hover:underline">Back to My Skills</a>
        </div>

        <form id="addSkillForm" class="space-y-4">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Skill Title</label>
                <input type="text" id="skill_name" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g. PC Repair, Maths Tutoring" required>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Category</label>
                <select id="category" class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-white outline-none" required>
                    <option value="Tech Repair">Tech Repair</option>
                    <option value="Tutoring">Tutoring</option>
                    <option value="Design">Design / Media</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Indicative Price (Rs.)</label>
                <input type="number" id="price" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="e.g. 500" required>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Description</label>
                <textarea id="description" rows="4" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none" placeholder="Describe what you can do..." required></textarea>
            </div>

            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 shadow-md">
                Publish Skill
            </button>
        </form>
        <div id="message" class="mt-4 text-center text-sm font-semibold hidden"></div>
    </div>

    <script>
        document.getElementById('addSkillForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const userId = localStorage.getItem('user_id');
            
            const payload = {
                action: 'create',
                student_id: userId,
                skill_name: document.getElementById('skill_name').value,
                category: document.getElementById('category').value,
                price: document.getElementById('price').value,
                description: document.getElementById('description').value
            };

            try {
                const response = await fetch('../../../backend/api/skills_api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                
                const messageEl = document.getElementById('message');
                messageEl.classList.remove('hidden');
                
                if (data.status === 'success') {
                    messageEl.className = 'mt-4 text-center text-sm font-semibold text-green-600';
                    messageEl.innerText = 'Skill added successfully!';
                    setTimeout(() => window.location.href = 'myskill.html', 1500);
                } else {
                    messageEl.className = 'mt-4 text-center text-sm font-semibold text-red-600';
                    messageEl.innerText = data.message || 'Error occurred';
                }
            } catch (error) {
                console.error("Error:", error);
            }
        });
    </script>
</body>
</html>
