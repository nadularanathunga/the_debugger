<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Wallet - Skill Market</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <nav class="bg-blue-600 text-white p-4 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">My Wallet</h1>
            <a href="student_dashboard.html" class="hover:text-blue-200">Dashboard</a>
        </div>
    </nav>

    <div class="max-w-4xl mx-auto mt-10 p-4">
        <!-- Balance Card -->
        <div class="bg-gradient-to-r from-green-500 to-emerald-600 rounded-2xl p-8 text-white shadow-lg mb-8 text-center">
            <h3 class="text-lg font-medium opacity-90">Available Balance</h3>
            <p class="text-5xl font-extrabold mt-2" id="wallet_balance">Rs. 0.00</p>
        </div>

        <!-- Transactions -->
        <div class="bg-white rounded-xl shadow-md p-6">
            <h3 class="text-xl font-bold text-gray-800 mb-4">Transaction History</h3>
            <div id="transactions_list" class="space-y-4">
                <!-- Transactions loaded here -->
            </div>
        </div>
    </div>

    <script>
        async function loadWallet() {
            const userId = localStorage.getItem('user_id');
            const list = document.getElementById('transactions_list');
            
            try {
                const response = await fetch('../../../backend/api/student/student_api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'get_wallet_data', user_id: userId })
                });
                const data = await response.json();
                
                if (data.status === 'success') {
                    document.getElementById('wallet_balance').innerText = `Rs. ${data.wallet_balance}`;
                    
                    if(data.transactions.length > 0) {
                        list.innerHTML = data.transactions.map(t => `
                            <div class="flex justify-between items-center border-b pb-3">
                                <div>
                                    <p class="font-bold text-gray-800">${t.description}</p>
                                    <p class="text-xs text-gray-500">${t.created_at} • ${t.category}</p>
                                </div>
                                <div class="font-bold ${t.transaction_type === 'INCOME' ? 'text-green-600' : 'text-red-600'}">
                                    ${t.transaction_type === 'INCOME' ? '+' : '-'} Rs. ${t.amount}
                                </div>
                            </div>
                        `).join('');
                    } else {
                        list.innerHTML = `<p class="text-gray-500">No transactions yet.</p>`;
                    }
                }
            } catch (error) {
                console.error("Error:", error);
            }
        }
        loadWallet();
    </script>
</body>
</html>
