<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Opportunity - Skill Market</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans p-6">

    <div class="max-w-3xl mx-auto bg-white p-8 rounded-xl shadow-md border-t-4 border-green-500">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-3xl font-extrabold text-gray-800">Post a New Task</h2>
            <a href="clientdashboard.html" class="text-blue-600 font-semibold hover:underline">Back to Dashboard</a>
        </div>
        <p class="text-gray-500 mb-6">Describe what you need done, set a budget, and find the right student for the job.</p>

        <form id="createTaskForm" class="space-y-5">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Task Title</label>
                <input type="text" id="title" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" placeholder="e.g. Need a POS System, Format Research Paper" required>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Required Department</label>
                    <select id="required_dept" class="w-full px-4 py-3 border border-gray-300 rounded-lg bg-white outline-none" required>
                        <option value="NONE">Any Department (NONE)</option>
                        <option value="ICT">Information & Communication Tech (ICT)</option>
                        <option value="ET">Engineering Tech (ET)</option>
                        <option value="BST">Biosystems Tech (BST)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Budget (Rs.)</label>
                    <input type="number" id="budget" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" placeholder="e.g. 2000" required>
                </div>
            </div>

            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Detailed Description</label>
                <textarea id="description" rows="5" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" placeholder="Provide clear requirements and details..." required></textarea>
            </div>

            <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition duration-300 shadow-md">
                Publish Opportunity
            </button>
        </form>
        <div id="message" class="mt-4 text-center text-sm font-semibold hidden"></div>
    </div>

    <script>
        document.getElementById('createTaskForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const userId = localStorage.getItem('user_id');
            
            if (!userId) {
                alert("Please login first.");
                window.location.href = '../auth/login.html';
                return;
            }

            const payload = {
                action: 'create_task',
                creator_id: userId,
                title: document.getElementById('title').value,
                required_dept: document.getElementById('required_dept').value,
                budget: document.getElementById('budget').value,
                description: document.getElementById('description').value
            };

            try {
                const response = await fetch('../../../backend/api/local/client_api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                
                const messageEl = document.getElementById('message');
                messageEl.classList.remove('hidden');
                
                if (data.status === 'success') {
                    messageEl.className = 'mt-4 text-center text-sm font-semibold text-green-600';
                    messageEl.innerText = 'Task created successfully!';
                    setTimeout(() => window.location.href = 'clientdashboard.html', 1500);
                } else {
                    messageEl.className = 'mt-4 text-center text-sm font-semibold text-red-600';
                    messageEl.innerText = data.message;
                }
            } catch (error) {
                console.error("Error:", error);
            }
        });
    </script>
</body>
</html>
