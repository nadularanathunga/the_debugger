<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Skill Market</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <nav class="bg-slate-800 text-white p-4 shadow-md">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">Admin Console</h1>
            <a href="../auth/login.html" onclick="logout()" class="hover:text-red-300">Logout</a>
        </div>
    </nav>

    <div class="max-w-6xl mx-auto mt-10 p-4">
        <h2 class="text-3xl font-extrabold text-gray-800 mb-8">Platform Overview</h2>

        <!-- Stats Grid -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl shadow-md border-l-4 border-blue-500">
                <h3 class="text-lg font-semibold text-gray-500">Total Users</h3>
                <p class="text-4xl font-bold text-gray-800 mt-2" id="total_users">0</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-md border-l-4 border-green-500">
                <h3 class="text-lg font-semibold text-gray-500">Total Tasks Posted</h3>
                <p class="text-4xl font-bold text-gray-800 mt-2" id="total_tasks">0</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-md border-l-4 border-purple-500">
                <h3 class="text-lg font-semibold text-gray-500">Skills Listed</h3>
                <p class="text-4xl font-bold text-gray-800 mt-2" id="total_skills">0</p>
            </div>
        </div>

        <!-- Recent Activity / Controls placeholder -->
        <div class="bg-white p-8 rounded-xl shadow-md">
            <h3 class="text-xl font-bold text-gray-800 mb-4">Quick Actions</h3>
            <div class="flex space-x-4">
                <button class="bg-slate-800 text-white px-6 py-3 rounded-lg font-bold hover:bg-slate-700">Manage Users</button>
                <button class="bg-slate-800 text-white px-6 py-3 rounded-lg font-bold hover:bg-slate-700">View Transactions</button>
                <button class="bg-slate-800 text-white px-6 py-3 rounded-lg font-bold hover:bg-slate-700">System Logs</button>
            </div>
        </div>
    </div>

    <script>
        const userId = localStorage.getItem('user_id');
        if (!userId) {
            window.location.href = '../auth/login.html';
        }

        async function loadAdminDashboard() {
            try {
                const response = await fetch('../../../backend/api/admin/admin_api.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ action: 'get_admin_stats' })
                });
                const data = await response.json();
                
                if (data.status === 'success') {
                    document.getElementById('total_users').innerText = data.users;
                    document.getElementById('total_tasks').innerText = data.tasks;
                    document.getElementById('total_skills').innerText = data.skills;
                }
            } catch (error) {
                console.error("Error:", error);
            }
        }

        function logout() {
            localStorage.clear();
            window.location.href = '../auth/login.html';
        }

        loadAdminDashboard();
    </script>
</body>
</html>
